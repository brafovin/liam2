<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MX Extreme</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; height:100vh; touch-action:none; }
canvas { display:block; width:100vw; height:100vh; }

#hud {
  position:fixed; top:0; left:0; right:0;
  padding:10px 14px;
  display:flex; justify-content:space-between; align-items:flex-start;
  pointer-events:none;
}
.hud-pill {
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:20px;
  padding:6px 14px;
  color:#fff;
  font:bold 15px/1 'Courier New', monospace;
  backdrop-filter:blur(6px);
  display:flex; align-items:center; gap:6px;
}
.hud-pill .val { color:#FFD700; }

#air-banner {
  position:fixed; top:18%; left:50%; transform:translateX(-50%);
  color:#FFD700; font:bold 28px 'Courier New', monospace;
  text-shadow:0 0 20px rgba(255,200,0,0.9), 0 2px 4px rgba(0,0,0,0.8);
  pointer-events:none; opacity:0; transition:opacity 0.2s;
  white-space:nowrap;
}
#air-banner.show { opacity:1; }

#trick-banner {
  position:fixed; top:28%; left:50%; transform:translateX(-50%);
  color:#2ecc71; font:bold 24px 'Courier New', monospace;
  text-shadow:0 0 15px rgba(46,204,113,0.9);
  pointer-events:none; opacity:0; transition:opacity 0.3s;
  white-space:nowrap;
}
#trick-banner.show { opacity:1; }

/* Touch controls */
#touch-controls {
  position:fixed; bottom:0; left:0; right:0;
  display:none;
  padding:10px;
  justify-content:space-between;
  pointer-events:none;
}
@media (pointer:coarse) { #touch-controls { display:flex; } }

.touch-group { display:flex; gap:8px; pointer-events:all; }
.touch-btn {
  width:64px; height:64px;
  background:rgba(255,255,255,0.15);
  border:2px solid rgba(255,255,255,0.3);
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:26px;
  user-select:none; -webkit-user-select:none;
  active:background:rgba(255,255,255,0.3);
}
.touch-btn:active { background:rgba(255,255,255,0.35); }

#crash-screen {
  position:fixed; inset:0;
  display:none;
  background:rgba(180,0,0,0.35);
  align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
  color:#fff; text-align:center;
  backdrop-filter:blur(3px);
}
#crash-screen.show { display:flex; }
#crash-screen h1 { font:bold 52px sans-serif; text-shadow:0 0 30px #f00; }
#crash-screen p  { font:20px sans-serif; color:#FFD700; }
#restart-btn {
  background:linear-gradient(180deg,#e74c3c,#c0392b);
  color:#fff; border:none;
  padding:14px 32px; border-radius:12px;
  font:bold 18px sans-serif; cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  margin-top:8px;
}
#restart-btn:hover { background:linear-gradient(180deg,#ff5a47,#e74c3c); }

#start-screen {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.8);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:18px;
  color:#fff; text-align:center;
  backdrop-filter:blur(4px);
}
#start-screen h1 { font:bold 60px sans-serif; color:#FFD700; text-shadow:0 0 30px rgba(255,215,0,0.7); }
#start-screen p  { font:16px sans-serif; color:#aaa; line-height:1.8; }
#start-btn {
  background:linear-gradient(180deg,#27ae60,#1e8449);
  color:#fff; border:none;
  padding:16px 40px; border-radius:14px;
  font:bold 20px sans-serif; cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#start-btn:hover { background:linear-gradient(180deg,#2ecc71,#27ae60); }

#controls-hint {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.4); font:11px monospace; text-align:center;
  pointer-events:none;
}
@media (pointer:coarse) { #controls-hint { display:none; } }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-pill">🏍️ <span class="val" id="h-spd">0</span> km/h</div>
  <div class="hud-pill">⭐ <span class="val" id="h-score">0</span></div>
  <div class="hud-pill">⏱ <span class="val" id="h-time">0.0</span>s</div>
</div>

<div id="air-banner">✈️ AIR 0.0s</div>
<div id="trick-banner">+0 pts!</div>

<div id="touch-controls">
  <div class="touch-group">
    <div class="touch-btn" id="tb-left">◀</div>
    <div class="touch-btn" id="tb-right">▶</div>
  </div>
  <div class="touch-group">
    <div class="touch-btn" id="tb-brake">🛑</div>
    <div class="touch-btn" id="tb-gas">⚡</div>
  </div>
</div>

<div id="crash-screen">
  <h1>💥 CRASH!</h1>
  <p id="crash-stats"></p>
  <button id="restart-btn" onclick="restartGame()">🔄 Nochmal</button>
</div>

<div id="start-screen">
  <h1>MX Extreme</h1>
  <p>
    <b>W / ↑</b> — Gas geben<br>
    <b>S / ↓</b> — Bremsen<br>
    <b>A / ←</b> — Zurücklehnen<br>
    <b>D / →</b> — Vorlehnen<br>
    <b>R</b> — Neu starten
  </p>
  <button id="start-btn" onclick="startGame()">🏁 Fahren!</button>
</div>

<div id="controls-hint">W/↑ Gas · S/↓ Bremse · A/← · D/→ Lehnen · R Neu</div>

<script>
// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
const G          = 1900;   // gravity px/s²
const WHEELBASE  = 92;
const WHEEL_R    = 15;
const THROTTLE   = 1100;
const BRAKE_PWR  = 2200;
const MAX_SPEED  = 680;
const LEAN_GND   = 700;    // lean torque on ground
const LEAN_AIR   = 160;    // lean torque in air

// ═══════════════════════════════════════════════════════
// TRACK GENERATION
// ═══════════════════════════════════════════════════════
function buildTrack() {
  const pts = [];
  const BASE = 460;
  let x = -800;

  const seg = (count, step, fn) => {
    for (let i = 0; i < count; i++, x += step)
      pts.push({ x, y: fn(i) });
  };

  // flat start
  seg(25, 40, () => BASE);

  // gentle hills
  seg(140, 22, i => BASE + Math.sin(x * 0.005) * 65 + Math.sin(x * 0.014) * 25);

  // whoops (rapid bumps)
  seg(80, 16, i => BASE + Math.max(0, Math.sin(i * 0.44 * Math.PI)) * 38);

  // flat
  seg(12, 40, () => BASE);

  // tabletop jump
  for (let i = 0; i <= 14; i++, x += 11) pts.push({ x, y: BASE - i * 13 });
  seg(10, 18, () => BASE - 14 * 13);
  for (let i = 14; i >= 0; i--, x += 11) pts.push({ x, y: BASE - i * 13 });

  // flat
  seg(10, 35, () => BASE);

  // double jump
  for (let i = 0; i <= 16; i++, x += 10) pts.push({ x, y: BASE - i * 15 });
  // gap
  pts.push({ x: x + 20, y: BASE - 350 });
  x += 180;
  pts.push({ x, y: BASE - 350 });
  for (let i = 16; i >= 0; i--, x += 10) pts.push({ x, y: BASE - i * 15 });

  // rolling hills 2
  seg(120, 24, i => BASE + Math.sin(x * 0.007) * 85 + Math.cos(x * 0.018) * 30);

  // step-up
  for (let i = 0; i <= 18; i++, x += 9) pts.push({ x, y: BASE - i * 11 });
  seg(6, 20, () => BASE - 18 * 11);
  for (let i = 0; i <= 20; i++, x += 9) pts.push({ x, y: BASE - 18 * 11 - i * 10 });
  // long descent
  seg(30, 18, i => BASE - 18 * 11 - 20 * 10 + i * 20);

  // triple rhythm
  for (let t = 0; t < 3; t++) {
    for (let i = 0; i <= 12; i++, x += 9) pts.push({ x, y: BASE - i * 12 });
    x += 80;
    pts.push({ x, y: BASE - 380 });
    x += 40;
    for (let i = 12; i >= 0; i--, x += 9) pts.push({ x, y: BASE - i * 12 });
    seg(6, 30, () => BASE);
  }

  // finish straight
  seg(50, 40, () => BASE);

  // hard wall at end
  pts.push({ x, y: BASE + 1500 });

  return pts;
}

const TRACK = buildTrack();

function terrainY(wx) {
  let lo = 0, hi = TRACK.length - 2;
  while (lo < hi - 1) {
    const m = (lo + hi) >> 1;
    TRACK[m].x <= wx ? (lo = m) : (hi = m);
  }
  for (let i = lo; i < TRACK.length - 1; i++) {
    const a = TRACK[i], b = TRACK[i + 1];
    if (a.x <= wx && b.x >= wx) {
      const t = (wx - a.x) / (b.x - a.x);
      return a.y + t * (b.y - a.y);
    }
  }
  return 600;
}

function terrainNormal(wx) {
  for (let i = 0; i < TRACK.length - 1; i++) {
    const a = TRACK[i], b = TRACK[i + 1];
    if (a.x <= wx && b.x >= wx) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: -dy / len, y: dx / len };
    }
  }
  return { x: 0, y: -1 };
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let front, rear, keys, state, parts;

const INPUTS = { up:false, down:false, left:false, right:false };

function initBike() {
  const sx = 0;
  const sy = terrainY(sx) - WHEEL_R - 280;
  front = { x: sx + WHEELBASE * 0.5, y: sy, vx: 0, vy: 0, spin: 0, grounded: false };
  rear  = { x: sx - WHEELBASE * 0.5, y: sy, vx: 0, vy: 0, spin: 0, grounded: false };
  state = { score: 0, time: 0, airTime: 0, maxAir: 0, crashed: false };
  parts = [];
}
initBike();

// ═══════════════════════════════════════════════════════
// PHYSICS
// ═══════════════════════════════════════════════════════
function resolveWheel(w) {
  const ty = terrainY(w.x);
  if (w.y + WHEEL_R >= ty) {
    const wasAir = !w.grounded;
    w.y = ty - WHEEL_R;
    const n = terrainNormal(w.x);
    const vn = w.vx * n.x + w.vy * n.y;
    if (vn < 0) {
      const impact = -vn;
      w.vx -= vn * n.x * 1.08;
      w.vy -= vn * n.y * 1.08;
      // landing dust
      if (impact > 180) spawnDust(w.x, w.y + WHEEL_R, 8);
    }
    // rolling friction
    const tx = n.y, ty2 = -n.x;
    const vt = w.vx * tx + w.vy * ty2;
    w.vx -= vt * 0.015 * tx;
    w.vy -= vt * 0.015 * ty2;
    w.grounded = true;
  } else {
    w.grounded = false;
  }
}

function physicsStep(dt) {
  if (state.crashed) return;

  // gravity
  front.vy += G * dt;
  rear.vy  += G * dt;

  const inAir = !front.grounded && !rear.grounded;
  const ang = Math.atan2(front.y - rear.y, front.x - rear.x);
  const cos = Math.cos(ang), sin = Math.sin(ang);
  const px = -sin, py = cos; // perpendicular (up)

  // lean
  const lean = (INPUTS.right ? 1 : 0) - (INPUTS.left ? 1 : 0);
  const lt = lean * (inAir ? LEAN_AIR : LEAN_GND) * dt;
  front.vx += px * lt; front.vy += py * lt;
  rear.vx  -= px * lt; rear.vy  -= py * lt;

  // auto-stabilise on ground
  if (!inAir && lean === 0) {
    const fDot = front.vx * px + front.vy * py;
    const rDot = rear.vx  * px + rear.vy  * py;
    const av   = (fDot - rDot) / WHEELBASE;
    const damp = av * 8 * dt;
    front.vx -= px * damp; front.vy -= py * damp;
    rear.vx  += px * damp; rear.vy  += py * damp;
  }

  // throttle on rear wheel
  if (INPUTS.up && rear.grounded) {
    const spd = Math.hypot(rear.vx, rear.vy);
    if (spd < MAX_SPEED) {
      rear.vx += cos * THROTTLE * dt;
      rear.vy += sin * THROTTLE * dt;
    }
    if (Math.random() < 0.35) spawnDust(rear.x, rear.y + WHEEL_R, 3);
  }

  // brake
  if (INPUTS.down) {
    const bF = BRAKE_PWR * dt;
    const applyBrake = (w) => {
      const spd = Math.hypot(w.vx, w.vy);
      if (spd > 5) { const f = Math.min(1, bF / spd); w.vx *= (1-f); w.vy *= (1-f); }
    };
    if (front.grounded) applyBrake(front);
    if (rear.grounded)  applyBrake(rear);
  }

  // integrate
  front.x += front.vx * dt; front.y += front.vy * dt;
  rear.x  += rear.vx  * dt; rear.y  += rear.vy  * dt;

  // maintain wheelbase (position + velocity projection)
  for (let iter = 0; iter < 4; iter++) {
    const dx = front.x - rear.x, dy = front.y - rear.y;
    const d  = Math.hypot(dx, dy);
    if (d < 0.001) continue;
    const err = (d - WHEELBASE) / d;
    const ox = dx * err * 0.5, oy = dy * err * 0.5;
    front.x -= ox; front.y -= oy;
    rear.x  += ox; rear.y  += oy;
    // velocity correction
    const nx = dx / d, ny = dy / d;
    const dv = (front.vx - rear.vx) * nx + (front.vy - rear.vy) * ny;
    if (dv > 0) {
      front.vx -= dv * nx * 0.5; front.vy -= dv * ny * 0.5;
      rear.vx  += dv * nx * 0.5; rear.vy  += dv * ny * 0.5;
    }
  }

  // terrain
  resolveWheel(front);
  resolveWheel(rear);

  // wheel spin visual
  const bikeSpd = (front.vx + rear.vx) / 2;
  front.spin += (bikeSpd / WHEEL_R) * (180 / Math.PI) * dt;
  rear.spin  += (bikeSpd / WHEEL_R) * (180 / Math.PI) * dt;

  // air time
  if (inAir) {
    state.airTime += dt;
  } else if (state.airTime > 0) {
    state.maxAir = Math.max(state.maxAir, state.airTime);
    if (state.airTime > 0.5) {
      const pts = Math.round(state.airTime * 110);
      state.score += pts;
      showTrick('+' + pts + ' pts  (' + state.airTime.toFixed(1) + 's air)');
    }
    state.airTime = 0;
  }

  // crash detection
  if (!inAir) {
    const bikeAng = Math.atan2(front.y - rear.y, front.x - rear.x);
    if (Math.abs(bikeAng) > 1.45) triggerCrash();
  }

  // particles
  parts = parts.filter(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 600 * dt;
    p.vx *= Math.pow(0.6, dt);
    p.life -= dt;
    return p.life > 0;
  });

  // time counter
  const spd = Math.abs((front.vx + rear.vx) / 2);
  if (spd > 15) state.time += dt;
}

function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x, y,
      vx: (Math.random() - 0.5) * 220,
      vy: -Math.random() * 180 - 30,
      life: 0.35 + Math.random() * 0.25,
      r: 2 + Math.random() * 3,
      color: `hsl(${28+Math.random()*18},${55+Math.random()*20}%,${35+Math.random()*20}%)`,
    });
  }
}

function triggerCrash() {
  if (state.crashed) return;
  state.crashed = true;
  for (let i = 0; i < 28; i++) {
    parts.push({
      x: (front.x+rear.x)/2, y: (front.y+rear.y)/2,
      vx: (Math.random()-0.5)*600, vy: (Math.random()-0.5)*600-220,
      life: 1.8, r: 3+Math.random()*7,
      color: `hsl(${Math.random()*50},90%,55%)`,
    });
  }
  document.getElementById('crash-stats').textContent =
    'Score: ' + state.score + ' pts  |  Zeit: ' + state.time.toFixed(1) + 's  |  Max Air: ' + state.maxAir.toFixed(1) + 's';
  document.getElementById('crash-screen').classList.add('show');
}

function restartGame() {
  document.getElementById('crash-screen').classList.remove('show');
  initBike();
}

// ═══════════════════════════════════════════════════════
// TRICKS
// ═══════════════════════════════════════════════════════
let trickTimer = null;
function showTrick(text) {
  const el = document.getElementById('trick-banner');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(trickTimer);
  trickTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

// Parallax bg elements
const BG_TREES = Array.from({ length: 80 }, () => ({
  x: Math.random() * 28000 - 2000,
  h: 55 + Math.random() * 110,
  w: 18 + Math.random() * 28,
  pine: Math.random() > 0.45,
  layer: Math.floor(Math.random() * 3),
}));

const MOUNTAINS = Array.from({ length: 12 }, (_, i) => ({
  x: i * 2200 + Math.random() * 800,
  w: 400 + Math.random() * 500,
  h: 150 + Math.random() * 200,
}));

const BANNERS = Array.from({ length: 18 }, (_, i) => ({
  x: 500 + i * 1300,
  color: `hsl(${Math.random()*360},80%,55%)`,
  txt: ['MX','RACE','JUMP','AIR','PRO','🏆','FLY','GRIP'][i % 8],
}));

// Pre-gen clouds
const CLOUDS = Array.from({ length: 14 }, () => ({
  x: Math.random() * 3.0,
  y: 0.04 + Math.random() * 0.25,
  w: 90 + Math.random() * 130,
  h: 28 + Math.random() * 22,
  spd: 0.003 + Math.random() * 0.005,
}));

let cloudScroll = 0;

function render() {
  const W = canvas.width, H = canvas.height;
  const bcx = (front.x + rear.x) / 2;
  const bcy = (front.y + rear.y) / 2;

  const CAM_X = bcx - W * 0.35;
  const CAM_Y = bcy - H * 0.5;

  const sx = wx => wx - CAM_X;
  const sy = wy => wy - CAM_Y;

  // ── Sky ──
  const skyG = ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0,   '#0e1d40');
  skyG.addColorStop(0.45,'#1e6ca8');
  skyG.addColorStop(0.75,'#87CEEB');
  skyG.addColorStop(1,   '#c8e8f8');
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sunX = W * 0.78, sunY = H * 0.14;
  const sunRad = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,55);
  sunRad.addColorStop(0,   'rgba(255,255,220,1)');
  sunRad.addColorStop(0.35,'rgba(255,210,60,0.85)');
  sunRad.addColorStop(1,   'rgba(255,180,0,0)');
  ctx.fillStyle = sunRad;
  ctx.fillRect(0, 0, W, H * 0.5);

  // Clouds
  cloudScroll += 0.4;
  CLOUDS.forEach(c => {
    const cx2 = ((c.x * W - cloudScroll * c.spd * W) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.2;
    const cy2 = c.y * H;
    ctx.save();
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx2, cy2, c.w * 0.5, c.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx2 - c.w*0.2, cy2 + c.h*0.1, c.w*0.38, c.h*0.42, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx2 + c.w*0.22, cy2 + c.h*0.08, c.w*0.35, c.h*0.38, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Mountains (parallax 0.08)
  const mPar = 0.08;
  ctx.fillStyle = '#2a3f6a';
  MOUNTAINS.forEach(m => {
    const mx = m.x - CAM_X * mPar;
    if (mx + m.w < 0 || mx > W) return;
    const mBase = sy(460);
    ctx.beginPath();
    ctx.moveTo(mx, mBase);
    ctx.lineTo(mx + m.w * 0.5, mBase - m.h);
    ctx.lineTo(mx + m.w, mBase);
    ctx.fill();
    // snow cap
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(mx + m.w*0.5, mBase - m.h);
    ctx.lineTo(mx + m.w*0.42, mBase - m.h*0.75);
    ctx.lineTo(mx + m.w*0.58, mBase - m.h*0.75);
    ctx.fill();
    ctx.fillStyle = '#2a3f6a';
  });

  // Background trees (parallax 0.18 / 0.35 / 0.6)
  const pars = [0.18, 0.35, 0.6];
  const alphas = [0.28, 0.5, 0.85];
  [0, 1, 2].forEach(layer => {
    const par = pars[layer];
    const alf = alphas[layer];
    BG_TREES.filter(t => t.layer === layer).forEach(t => {
      const tx2 = t.x - CAM_X * par;
      if (tx2 < -60 || tx2 > W + 60) return;
      const gnd = sy(460);
      ctx.save();
      ctx.globalAlpha = alf;
      if (t.pine) {
        ctx.fillStyle = '#1a5018';
        ctx.beginPath();
        ctx.moveTo(tx2 - t.w/2, gnd);
        ctx.lineTo(tx2, gnd - t.h);
        ctx.lineTo(tx2 + t.w/2, gnd);
        ctx.fill();
      } else {
        // trunk
        ctx.fillStyle = '#5a3a20';
        ctx.fillRect(tx2 - 3, gnd - t.h*0.5, 6, t.h*0.5);
        // canopy
        ctx.fillStyle = '#2a6820';
        ctx.beginPath();
        ctx.arc(tx2, gnd - t.h*0.6, t.w*0.55, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
  });

  // ── TERRAIN ──
  let startI = 0;
  for (let i = 0; i < TRACK.length - 1; i++) {
    if (TRACK[i].x > CAM_X - 80) { startI = Math.max(0, i-1); break; }
  }

  // Rock fill below surface
  ctx.beginPath();
  ctx.moveTo(sx(TRACK[startI].x), H + 20);
  let drawnEnd = false;
  for (let i = startI; i < TRACK.length; i++) {
    const px = sx(TRACK[i].x), py = sy(TRACK[i].y);
    ctx.lineTo(px, py);
    if (px > W + 80) {
      ctx.lineTo(px, H + 20);
      drawnEnd = true;
      break;
    }
  }
  if (!drawnEnd) ctx.lineTo(sx(TRACK[TRACK.length-1].x), H + 20);
  ctx.closePath();

  const earthG = ctx.createLinearGradient(0, sy(380), 0, H);
  earthG.addColorStop(0,   '#8b6242');
  earthG.addColorStop(0.15,'#6b4a2e');
  earthG.addColorStop(1,   '#2e1a0a');
  ctx.fillStyle = earthG;
  ctx.fill();

  // Grass top strip
  ctx.beginPath();
  for (let i = startI; i < TRACK.length; i++) {
    const px = sx(TRACK[i].x), py = sy(TRACK[i].y);
    i === startI ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    if (px > W + 80) break;
  }
  ctx.strokeStyle = '#4a8a30';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Dirt track surface
  ctx.beginPath();
  for (let i = startI; i < TRACK.length; i++) {
    const px = sx(TRACK[i].x), py = sy(TRACK[i].y);
    i === startI ? ctx.moveTo(px, py - 4) : ctx.lineTo(px, py - 4);
    if (px > W + 80) break;
  }
  ctx.strokeStyle = '#c09058';
  ctx.lineWidth = 8;
  ctx.setLineDash([36, 10]);
  ctx.lineDashOffset = -(bcx * 0.18) % 46;
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Banners ──
  BANNERS.forEach(b => {
    const bx = sx(b.x);
    if (bx < -60 || bx > W + 60) return;
    const by = sy(terrainY(b.x) - 75);
    ctx.fillStyle = '#555';
    ctx.fillRect(bx - 2, by, 4, 75);
    ctx.fillStyle = b.color;
    const bw = 54, bh = 20;
    ctx.fillRect(bx - bw/2, by, bw, bh);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.txt, bx, by + 14);
    ctx.textAlign = 'left';
  });

  // ── Particles ──
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life * 2.5);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Bike ──
  drawBike(sx, sy);

  // ── Air banner ──
  const inAir = !front.grounded && !rear.grounded;
  const airEl = document.getElementById('air-banner');
  if (inAir && state.airTime > 0.25) {
    airEl.textContent = '✈️ AIR ' + state.airTime.toFixed(1) + 's';
    airEl.classList.add('show');
  } else {
    airEl.classList.remove('show');
  }

  // ── HUD ──
  const spd = Math.abs((front.vx + rear.vx) / 2);
  document.getElementById('h-spd').textContent   = Math.round(spd * 0.055);
  document.getElementById('h-score').textContent = state.score;
  document.getElementById('h-time').textContent  = state.time.toFixed(1);
}

function drawBike(sx, sy) {
  const ang = Math.atan2(front.y - rear.y, front.x - rear.x);
  const cos = Math.cos(ang), sin = Math.sin(ang);
  const px = -sin, py = cos;

  const frx = sx(front.x), fry = sy(front.y);
  const rrx = sx(rear.x),  rry = sy(rear.y);

  const FRAME_H = 24;
  const fFx = frx + px * FRAME_H, fFy = fry + py * FRAME_H;
  const rFx = rrx + px * FRAME_H, rFy = rry + py * FRAME_H;

  // ── Swing arm ──
  ctx.beginPath(); ctx.moveTo(rrx, rry); ctx.lineTo(rFx + cos*6, rFy + sin*6);
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 4; ctx.stroke();

  // ── Main frame ──
  ctx.beginPath(); ctx.moveTo(rFx, rFy); ctx.lineTo(fFx, fFy);
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 8; ctx.stroke();

  // subframe
  ctx.beginPath();
  ctx.moveTo(rFx + cos*8 + px*2, rFy + sin*8 + py*2);
  ctx.lineTo(rFx - cos*4 - px*6, rFy - sin*4 - py*6);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3; ctx.stroke();

  // ── Front fork ──
  ctx.beginPath(); ctx.moveTo(fFx, fFy); ctx.lineTo(frx, fry);
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 5; ctx.stroke();

  // ── Engine block ──
  const engX = rFx + cos * 28, engY = rFy + sin * 28;
  ctx.save();
  ctx.translate(engX, engY);
  ctx.rotate(ang);
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(-13, -9, 26, 18);
  ctx.fillStyle = '#555'; ctx.fillRect(-11, -7, 22, 14);
  // fins
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = '#444';
    ctx.fillRect(-11, -7 + i*4, 22, 2);
  }
  ctx.restore();

  // ── Exhaust ──
  ctx.beginPath();
  ctx.moveTo(engX - cos*2, engY - sin*2);
  ctx.quadraticCurveTo(rrx - px*10, rry - py*10, rrx + cos*6, rry + sin*6);
  ctx.strokeStyle = '#777'; ctx.lineWidth = 6; ctx.stroke();
  ctx.strokeStyle = '#999'; ctx.lineWidth = 3; ctx.stroke();

  // ── Handlebars ──
  const hbX = fFx + px*9 + cos*4, hbY = fFy + py*9 + sin*4;
  ctx.beginPath();
  ctx.moveTo(hbX - px*13, hbY - py*13);
  ctx.lineTo(hbX + px*13, hbY + py*13);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 4; ctx.stroke();

  // ── Rider ──
  const seat = 0.45; // 0=rear, 1=front
  const riderX = rrx + (frx - rrx) * seat + px * FRAME_H * 1.1;
  const riderY = rry + (fry - rry) * seat + py * FRAME_H * 1.1;
  ctx.save();
  ctx.translate(riderX, riderY);
  ctx.rotate(ang);

  // helmet
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath(); ctx.arc(0, -36, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.arc(0, -36, 10, -Math.PI*0.8, 0); ctx.fill();
  // visor
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.beginPath(); ctx.arc(3, -34, 6, -0.2, 0.85); ctx.fill();

  // torso
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(-6, -26, 12, 20);
  // chest protector
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(-5, -25, 10, 12);

  // arms
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(-18, -24, 12, 4);
  ctx.fillRect(6,   -24, 12, 4);
  // gloves
  ctx.fillStyle = '#222';
  ctx.fillRect(-20, -24, 5, 4);
  ctx.fillRect(15,  -24, 5, 4);

  // legs
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(-6, -6, 5, 16);
  ctx.fillRect(1,  -6, 5, 16);
  // knee guards
  ctx.fillStyle = '#555';
  ctx.fillRect(-7, -2, 5, 6);
  ctx.fillRect(2, -2, 5, 6);
  // boots
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-7, 9, 7, 6);
  ctx.fillRect(1,  9, 7, 6);

  ctx.restore();

  // ── Wheels ──
  [
    { w: front, sx: frx, sy: fry },
    { w: rear,  sx: rrx, sy: rry },
  ].forEach(({ w, sx: wx, sy: wy }) => {
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(wx, wy + WHEEL_R, WHEEL_R * 0.9, WHEEL_R * 0.25, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // tire
    ctx.beginPath();
    ctx.arc(wx, wy, WHEEL_R, 0, Math.PI*2);
    ctx.fillStyle = '#191919';
    ctx.fill();

    // tire tread pattern
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wx, wy, WHEEL_R - 2, 0, Math.PI*2);
    ctx.stroke();

    // rim
    ctx.beginPath();
    ctx.arc(wx, wy, WHEEL_R * 0.55, 0, Math.PI*2);
    ctx.fillStyle = '#aaa';
    ctx.fill();
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.stroke();

    // spokes
    const spinRad = w.spin * Math.PI / 180;
    for (let s = 0; s < 8; s++) {
      const a = spinRad + s * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(a)*WHEEL_R*0.52, wy + Math.sin(a)*WHEEL_R*0.52);
      ctx.lineTo(wx + Math.cos(a)*WHEEL_R*0.9,  wy + Math.sin(a)*WHEEL_R*0.9);
      ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    // hub
    ctx.beginPath();
    ctx.arc(wx, wy, WHEEL_R * 0.18, 0, Math.PI*2);
    ctx.fillStyle = '#ddd';
    ctx.fill();
  });

  // Brake disc flash
  if (INPUTS.down) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#ff4400';
    ctx.beginPath(); ctx.arc(frx, fry, WHEEL_R*0.45, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Throttle indicator ──
  if (INPUTS.up && rear.grounded) {
    const ex = rrx + cos*6, ey = rry + sin*6;
    const puffs = [1, 0.7, 0.4];
    puffs.forEach((a, i) => {
      ctx.save();
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.arc(ex - cos*(10+i*8), ey - sin*(10+i*8), 4+i*3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.code==='ArrowUp'   ||e.code==='KeyW') INPUTS.up    = true;
  if (e.code==='ArrowDown' ||e.code==='KeyS') INPUTS.down  = true;
  if (e.code==='ArrowLeft' ||e.code==='KeyA') INPUTS.left  = true;
  if (e.code==='ArrowRight'||e.code==='KeyD') INPUTS.right = true;
  if (e.code==='KeyR') restartGame();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))
    e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (e.code==='ArrowUp'   ||e.code==='KeyW') INPUTS.up    = false;
  if (e.code==='ArrowDown' ||e.code==='KeyS') INPUTS.down  = false;
  if (e.code==='ArrowLeft' ||e.code==='KeyA') INPUTS.left  = false;
  if (e.code==='ArrowRight'||e.code==='KeyD') INPUTS.right = false;
});

// Touch buttons
[['tb-gas','up'],['tb-brake','down'],['tb-left','left'],['tb-right','right']].forEach(([id, k]) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { INPUTS[k]=true;  e.preventDefault(); }, { passive:false });
  el.addEventListener('touchend',   e => { INPUTS[k]=false; e.preventDefault(); }, { passive:false });
  el.addEventListener('touchcancel',e => { INPUTS[k]=false; }, { passive:false });
});

// ═══════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════
let running = false;
let lastT   = 0;

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (running) {
    physicsStep(dt);
    render();
  }
  requestAnimationFrame(loop);
}

// Just render the start screen backdrop
requestAnimationFrame(function bg(now) {
  if (!running) {
    render(); // draw track behind start screen
    requestAnimationFrame(bg);
  }
});
</script>
